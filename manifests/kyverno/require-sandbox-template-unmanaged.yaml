apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-sandbox-template-unmanaged
  annotations:
    policies.kyverno.io/title: Require Unmanaged network policy on SandboxTemplates
    policies.kyverno.io/severity: critical
    policies.kyverno.io/category: Network Isolation
    policies.kyverno.io/description: >-
      SandboxTemplate.spec.networkPolicyManagement defaults to Managed, and in
      that mode the agent-sandbox controller creates its own NetworkPolicy
      allowing egress to 0.0.0.0/0 minus private ranges on every port.
      NetworkPolicies are additive, so that policy would let sandbox pods skip
      the Envoy egress proxy and reach the internet directly. Terraform owns
      sandbox network policy (pi-egress.tf); every template must opt out. The
      CRD applies its default before admission, so an omitted field is
      rejected too.
spec:
  validationFailureAction: Enforce
  webhookConfiguration:
    failurePolicy: Fail
  background: false
  rules:
    - name: sandbox-template-must-be-unmanaged
      match:
        any:
          - resources:
              kinds: [extensions.agents.x-k8s.io/*/SandboxTemplate]
              operations: [CREATE, UPDATE]
      validate:
        message: >-
          SandboxTemplates must set spec.networkPolicyManagement: Unmanaged.
          Sandbox NetworkPolicy is owned by Terraform; the controller's Managed
          policy allows direct public egress.
        pattern:
          spec:
            networkPolicyManagement: Unmanaged
